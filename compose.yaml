services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-regdrive_ged}
      POSTGRES_USER: ${POSTGRES_USER:-regdrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regdrive}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-regdrive_ged}
      DB_USERNAME: ${POSTGRES_USER:-regdrive}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-regdrive}
      JWT_SECRET: ${JWT_SECRET:-docker-development-secret-change-me-12345}
      DEMO_USERS_ENABLED: ${DEMO_USERS_ENABLED:-true}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin123}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-user123}
      DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD:-viewer123}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
